name: Boundary CI
on:
  pull_request:
  push:
    branches: [main, architecture/saas-v0.3]
jobs:
  typescript-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
