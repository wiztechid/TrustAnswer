name: Bootstrap npm lockfile
on:
  workflow_dispatch:
  push:
    branches: [architecture/saas-v0.3]
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "build: commit npm dependency lockfile"
          git push origin HEAD:architecture/saas-v0.3
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
